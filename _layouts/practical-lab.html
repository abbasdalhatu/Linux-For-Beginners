{% if content contains '<!doctype html>' or content contains '<!DOCTYPE html>' %}
{{ content }}
{% else %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>{{ page.title | default: page.name | default: "Practical Lab" }} | Linux for Beginners</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131c32;--line:#293653;--text:#eef2ff;--muted:#a8b3cc;--accent:#a78bfa;--cyan:#67e8f9}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#182448 0,#0b1020 58%);color:var(--text);font:16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{width:min(920px,calc(100% - 36px));margin:0 auto;padding:34px 0 64px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.topbar a{color:var(--cyan);font-weight:650;text-decoration:none}
.topbar a:hover{color:var(--accent)}
.lesson-content{padding:clamp(20px,4vw,36px);border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(19,28,50,.96),rgba(16,24,39,.96));box-shadow:0 18px 55px rgba(0,0,0,.18);overflow-wrap:anywhere}
.lesson-content h1{font-size:clamp(1.8rem,5vw,2.65rem);line-height:1.15;letter-spacing:-.035em;color:var(--text);margin:0 0 14px}
.lesson-content h2{font-size:clamp(1.25rem,3vw,1.65rem);color:var(--text);margin:30px 0 12px}
.lesson-content h3{font-size:1.12rem;color:var(--accent);margin:24px 0 10px}
.lesson-content p,.lesson-content li{color:var(--muted)}
.lesson-content strong{color:var(--text)}
.lesson-content a{color:var(--cyan)}
.lesson-content hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.lesson-content ul,.lesson-content ol{padding-left:1.5rem}
.lesson-content li{padding:3px 0}
.lesson-content pre{padding:18px;overflow-x:auto;border:1px solid #33415f;border-radius:12px;background:#080d19;color:#e5eaff;line-height:1.55}
.lesson-content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em}
.lesson-content :not(pre)>code{padding:.15em .4em;border-radius:5px;background:#202b45;color:#c4b5fd}
.lesson-content blockquote{margin:20px 0;padding:12px 18px;border-left:3px solid var(--accent);background:#18233a;color:var(--muted);border-radius:0 10px 10px 0}
.lesson-content table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}
.lesson-content th,.lesson-content td{padding:10px 13px;border:1px solid var(--line);text-align:left}
.lesson-content th{background:#202b45;color:var(--text)}
.footer{margin-top:22px;color:var(--muted);font-size:.88rem;text-align:center}
@media(max-width:600px){main{width:calc(100% - 22px);padding-top:22px}.lesson-content{padding:18px}.lesson-content pre{padding:13px}}
</style>
</head>
<body>
<main>
<nav class="topbar"><a href="{{ page.dir | append: '/index.html' | relative_url }}">← Back to module overview</a><a href="{{ '/' | relative_url }}">← All course modules</a></nav>
<article class="lesson-content">{{ content }}</article>
<footer class="footer">Linux for Beginners · Learn. Practise. Understand. Secure.</footer>
</main>
</body>
</html>
{% endif %}
